<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.google.com; connect-src 'self' https://firestore.googleapis.com https://www.gstatic.com https://open.er-api.com http://127.0.0.1:8080; object-src 'none'; base-uri 'none'; form-action 'none';">
<meta name="referrer" content="strict-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split</title>
<meta name="description" content="Split trip and group expenses with friends. Free, no sign-up.">
<meta name="theme-color" content="#0f8b6c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f6f5; --card: #ffffff; --ink: #1b2420; --muted: #66736d; --line: #e1e6e3;
  --accent: #0f8b6c; --accent-ink: #ffffff; --accent-soft: #e3f3ee;
  --pos: #0f8b6c; --neg: #c4432b; --warn-bg: #fff6dc; --warn-ink: #6b5200;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111614; --card: #1b2220; --ink: #e8eeeb; --muted: #94a39c; --line: #2c3532;
    --accent: #3cc49f; --accent-ink: #06231b; --accent-soft: #173029;
    --pos: #3cc49f; --neg: #f07a62; --warn-bg: #3a3214; --warn-ink: #f3dc8c;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 0 16px 112px; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 8px; padding: 12px 0 10px; }
header.top h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
  background: var(--accent-soft); color: var(--ink); text-decoration: none; display: inline-block; }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.danger { background: transparent; color: var(--neg); }
a.back { font-size: 26px; line-height: 1; padding: 4px 14px 8px; }
button.icon { background: transparent; padding: 8px 10px; font-size: 20px; line-height: 1; }
button:disabled { opacity: .5; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 10px 0; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line);
  color: inherit; text-decoration: none; }
.row:first-child { border-top: 0; }
p a, .small a { color: var(--accent); }
a.plain { color: inherit; text-decoration: none; display: block; }
h3 { font-size: 16px; margin: 20px 0 6px; }
.row button { padding: 8px 12px; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.small { font-size: 13px; color: var(--muted); }
.right { text-align: right; white-space: nowrap; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px;
  font-size: 14px; margin: 8px 0; }
.tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs a { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 600; }
.tabs a.on { background: var(--accent-soft); color: var(--ink); }
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom));
  box-shadow: 0 6px 18px rgba(0,0,0,.18); padding: 14px 22px; border-radius: 999px; z-index: 6; }
label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
input, select { font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
.inline { display: flex; gap: 8px; align-items: center; }
.inline > * { min-width: 0; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.seg button { padding: 8px 4px; background: var(--card); border: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.split-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.split-row:first-child { border-top: 0; }
.split-row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.split-row input:not([type=checkbox]) { width: 110px; text-align: right; }
.hint { font-size: 14px; margin-top: 8px; }
.actions { display: flex; gap: 8px; margin-top: 18px; }
.actions .primary { flex: 1; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.big { font-size: 22px; font-weight: 700; }
.toast { position: fixed; left: 16px; right: 16px; bottom: 90px; max-width: 520px; margin: 0 auto; z-index: 9;
  background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 10px; font-size: 14px; }
</style>
</head>
<body>
<main id="app"><p class="empty">Loading…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
